<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Task Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
    }
    h1 {
      font-size: 2rem;
      color: #f97316;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .auth-box {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      margin-bottom: 2rem;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      margin: 0.5rem 0;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 1rem;
    }
    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      margin: 0.5rem 0.25rem;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    .btn-primary { background: #f97316; color: white; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-success { background: #22c55e; color: white; }
    .task-form {
      background: #1e293b;
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 2rem;
    }
    select {
      width: 100%;
      padding: 0.75rem;
      margin: 0.5rem 0;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 1rem;
    }
    .task-card {
      background: #1e293b;
      padding: 1.25rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      border-left: 4px solid #f97316;
    }
    .task-card.completed {
      opacity: 0.6;
      border-left-color: #22c55e;
    }
    .task-card.high { border-left-color: #ef4444; }
    .task-card.medium { border-left-color: #f97316; }
    .task-card.low { border-left-color: #22c55e; }
    .task-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .task-meta {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 0.5rem;
    }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-right: 0.5rem;
    }
    .badge-high { background: #ef444433; color: #ef4444; }
    .badge-medium { background: #f9731633; color: #f97316; }
    .badge-low { background: #22c55e33; color: #22c55e; }
    .hidden { display: none; }
    #userInfo {
      text-align: right;
      margin-bottom: 1rem;
      color: #94a3b8;
      font-size: 0.9rem;
    }
    .status-msg {
      padding: 0.75rem;
      border-radius: 8px;
      margin: 0.5rem 0;
      font-size: 0.9rem;
    }
    .status-success { background: #22c55e22; color: #22c55e; }
    .status-error { background: #ef444422; color: #ef4444; }
  </style>
</head>
<body>
<div class="container">
  <h1>🔥 AI Task Manager</h1>

  <!-- Auth Section -->
  <div class="auth-box" id="authSection">
    <h2 style="margin-bottom:1rem; color:#f97316">Sign In / Sign Up</h2>
    <input type="email" id="email" placeholder="Email address" />
    <input type="password" id="password" placeholder="Password" />
    <div>
      <button class="btn-primary" onclick="signUp()">Sign Up</button>
      <button class="btn-secondary" onclick="signIn()">Sign In</button>
    </div>
    <div id="authMsg"></div>
  </div>

  <!-- App Section (hidden until logged in) -->
  <div id="appSection" class="hidden">
    <div id="userInfo">
      Logged in as: <strong id="userEmail"></strong>
      <button class="btn-secondary" onclick="signOut()" 
        style="margin-left:1rem; padding:0.4rem 0.8rem; font-size:0.85rem">
        Sign Out
      </button>
    </div>

    <!-- Add Task Form -->
    <div class="task-form">
      <h2 style="margin-bottom:1rem; color:#f97316">Add New Task</h2>
      <input type="text" id="taskTitle" placeholder="Task title" />
      <input type="text" id="taskDesc" placeholder="Description (optional)" />
      <select id="taskPriority">
        <option value="low">🟢 Low Priority</option>
        <option value="medium" selected>🟡 Medium Priority</option>
        <option value="high">🔴 High Priority</option>
      </select>
      <input type="date" id="taskDueDate" />
      <button class="btn-primary" onclick="addTask()">+ Add Task</button>
      <div id="taskMsg"></div>
    </div>

    <!-- Task List -->
    <div id="taskList"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut as firebaseSignOut
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import {
    getFirestore,
    collection,
    addDoc,
    query,
    where,
    onSnapshot,
    updateDoc,
    deleteDoc,
    doc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // ✅ PASTE YOUR FIREBASE CONFIG HERE
  const firebaseConfig = {
    apiKey: "AIzaSyCT-9dYQ5Nuf2l7gciBFpYFwQb9jJTUa_s",
    authDomain: "ai-powered-e4bd1.firebaseapp.com",
    projectId: "ai-powered-e4bd1",
    storageBucket: "ai-powered-e4bd1.appspot.com",
    messagingSenderId: "389427833077",
    appId: "1:389427833077:web:f9f00683f3de9aac027dbc"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;

  // Auth state listener
  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      document.getElementById("authSection").classList.add("hidden");
      document.getElementById("appSection").classList.remove("hidden");
      document.getElementById("userEmail").textContent = user.email;
      loadTasks(user.uid);
    } else {
      currentUser = null;
      document.getElementById("authSection").classList.remove("hidden");
      document.getElementById("appSection").classList.add("hidden");
      document.getElementById("taskList").innerHTML = "";
    }
  });

  // Sign Up
  window.signUp = async () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    try {
      await createUserWithEmailAndPassword(auth, email, password);
      showMsg("authMsg", "✅ Account created!", "success");
    } catch (e) {
      showMsg("authMsg", "❌ " + e.message, "error");
    }
  };

  // Sign In
  window.signIn = async () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
      showMsg("authMsg", "✅ Signed in!", "success");
    } catch (e) {
      showMsg("authMsg", "❌ " + e.message, "error");
    }
  };

  // Sign Out
  window.signOut = async () => {
    await firebaseSignOut(auth);
  };

  // Add Task
  window.addTask = async () => {
    if (!currentUser) return;
    const title = document.getElementById("taskTitle").value.trim();
    if (!title) {
      showMsg("taskMsg", "❌ Title is required!", "error");
      return;
    }
    try {
      await addDoc(collection(db, "tasks"), {
        title,
        description: document.getElementById("taskDesc").value,
        priority: document.getElementById("taskPriority").value,
        dueDate: document.getElementById("taskDueDate").value,
        isCompleted: false,
        userId: currentUser.uid,
        createdAt: serverTimestamp()
      });
      document.getElementById("taskTitle").value = "";
      document.getElementById("taskDesc").value = "";
      showMsg("taskMsg", "✅ Task added!", "success");
    } catch (e) {
      showMsg("taskMsg", "❌ " + e.message, "error");
    }
  };

  // Load Tasks (real-time)
  function loadTasks(uid) {
    const q = query(
      collection(db, "tasks"),
      where("userId", "==", uid)
    );
    onSnapshot(q, (snapshot) => {
      const taskList = document.getElementById("taskList");
      taskList.innerHTML = "";
      if (snapshot.empty) {
        taskList.innerHTML =
          '<p style="color:#94a3b8;text-align:center">No tasks yet. Add one above! 👆</p>';
        return;
      }
      snapshot.forEach((docSnap) => {
        const task = docSnap.data();
        const id = docSnap.id;
        taskList.innerHTML += `
          <div class="task-card ${task.isCompleted ? 'completed' : task.priority}">
            <div class="task-title"
              style="${task.isCompleted ? 'text-decoration:line-through' : ''}">
              ${task.title}
            </div>
            <div class="task-meta">
              ${task.description ? task.description + ' • ' : ''}
              ${task.dueDate ? '📅 ' + task.dueDate : ''}
            </div>
            <span class="badge badge-${task.priority}">${task.priority}</span>
            <span class="badge" style="background:#33415533;color:#94a3b8">
              ${task.isCompleted ? '✅ Done' : '⏳ Pending'}
            </span>
            <div style="margin-top:0.75rem">
              <button class="btn-success"
                style="padding:0.4rem 0.8rem;font-size:0.8rem"
                onclick="toggleTask('${id}', ${task.isCompleted})">
                ${task.isCompleted ? 'Undo' : '✓ Complete'}
              </button>
              <button class="btn-danger"
                style="padding:0.4rem 0.8rem;font-size:0.8rem"
                onclick="deleteTask('${id}')">
                🗑 Delete
              </button>
            </div>
          </div>`;
      });
    });
  }

  // Toggle Complete
  window.toggleTask = async (id, current) => {
    await updateDoc(doc(db, "tasks", id), {
      isCompleted: !current
    });
  };

  // Delete Task
  window.deleteTask = async (id) => {
    await deleteDoc(doc(db, "tasks", id));
  };

  // Show message helper
  function showMsg(id, msg, type) {
    const el = document.getElementById(id);
    el.innerHTML =
      `<div class="status-msg status-${type}">${msg}</div>`;
    setTimeout(() => el.innerHTML = "", 3000);
  }
</script>
</body>
</html>
